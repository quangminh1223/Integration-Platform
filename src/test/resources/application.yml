spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

kafka:
  topics:
    qr-generated: qr.generated.test
    qr-parsed: qr.parsed.test

qr:
  image:
    width: 200
    height: 200
    format: PNG
    margin: 1
  cache:
    ttl-seconds: 60
